# NeoForbric（现名 ModRelay）构建配置
# 统一词条：模组 id = neoforbric（内部标识，永不变）/ 玩家可见显示名 = mod_display_name
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false

# 目标平台：Minecraft 1.21.1 + NeoForge 21.1.x
minecraft_version=1.21.1
neoforge_version=21.1.77

# 内置的信雅互联（Sinytra Connector）版本 —— 注意：**现在只是构建期记录的参考版本**，
# 信雅互联已不再打包进本模组（改为运行时按需下载，见 docs/15）。
# 这个值会写进 neoforbric-build.properties，用于启动横幅里显示「构建时记录的参考版本」。
connector_version=2.0.0-beta.17+1.21.1

# 模组自身信息
mod_version=0.0.10-alpha.9
maven_group=com.deepseek.neoforbric
archives_base_name=neoforbric

# 玩家可见的显示名（对外品牌）。只影响显示名、界面标题、加载标签、公开简介与 User-Agent。
# 内部标识一律保持 neoforbric 不变：modid、Java 包名、资源命名空间、翻译键、
# config/neoforbric 与 mods/.neoforbric 路径、日志与报告文件名、构建产物文件名。
# 这样旧版本的配置、备份与 journal 仍能被识别，同一实例不会出现两个模组。
# 只写 ASCII：gradle.properties 由 java.util.Properties 读取，中文会乱码。
mod_display_name=ModRelay
# 显示名的中文称呼只在语言文件与文档里出现，不进构建元数据。
mod_homepage=https://github.com/WHanG2237/NeoForbric-Downloader
