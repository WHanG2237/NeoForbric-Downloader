# NeoForbric 构建配置
# 统一词条：模组 id = neoforbric / 显示名 = NeoForbric（v0.0.6 起不再带「万能转译加载器」后缀）
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false

# 目标平台：Minecraft 1.21.1 + NeoForge 21.1.x
minecraft_version=1.21.1
neoforge_version=21.1.77

# 内置的信雅互联（Sinytra Connector）版本 —— 注意：**现在只是构建期记录的参考版本**，
# 信雅互联已不再打包进本模组（改为运行时按需下载，见 docs/15）。
# 这个值会写进 neoforbric-build.properties，用于启动横幅里显示「构建时记录的参考版本」。
connector_version=2.0.0-beta.17+1.21.1

# 模组自身信息
mod_version=0.0.8
maven_group=com.deepseek.neoforbric
archives_base_name=neoforbric
