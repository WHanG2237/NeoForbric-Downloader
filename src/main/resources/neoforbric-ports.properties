# NeoForbric port map (built-in defaults)
#
# Format: <source modid> = <target>[,<target>...][@<expected modid>]
#   target: a bare number is a CurseForge project id, anything else is a Modrinth id/slug.
#           (CurseForge project identifiers are numeric only, Modrinth ones are base62 strings,
#            so the two never collide and the prefix can be omitted. cf: / mr: still work if you
#            want to be explicit, and the long forms curseforge: / modrinth: are accepted too.)
#   Several targets are tried in order - the first one supplies the CDN.
#   Without @, the expected modid defaults to the source modid on the left of the equals sign.
#   Write @thatmodid when the port's modid differs, or @* to skip the check entirely.
#
# This is a whitelist: only mods listed here take the "swap in a community port" route.
# A hit downloads the latest build of that project for 1.21.1 + NeoForge and replaces the original
# file (keeping its name). The downloaded file must be a NeoForge mod reporting the expected modid.
#
# Why it exists: some large Fabric mods run through Sinytra Connector but are still broken in game.
# BetterEnd was measured doing wrong biome generation, not replacing the sky box and shuffling the
# creative tab. Only swapping in a port fixes that.
#
# The player file config/neoforbric/ports.properties takes precedence over this table when it exists.

# ---- BetterX family (BetterEnd / BetterNether and their libraries): the "New Dawn" port chain ----
# Upstream BetterEnd / BetterNether only ship Fabric builds; New Dawn is a community continuation
# that also ships NeoForge builds, and its changelog explicitly fixes the sky box (21.0.19) and the
# shuffled creative tab (21.0.12).
#
# Every entry lists two targets with CurseForge first: the same file exists on both sites, but the
# CurseForge CDN (mediafilez.forgecdn.net) measured one to two orders of magnitude faster than the
# Modrinth CDN - 26.6 MB at about 20 KB/s takes 22 minutes on cdn.modrinth.com, which looks exactly
# like a freeze. CurseForge first with Modrinth as fallback: the CurseForge mirror occasionally
# answers 502, and then the download falls through to Modrinth.
#
# All five ports report the same modid as the source mod (verified by downloading every package on
# 2026-10-11, 1.21.1 + latest NeoForge):
#   betterend    21.0.36  modId=betterend    (depends on bclib>=21.0.14 / wover>=21.0.16 / wunderlib>=21.0.9)
#   betternether 21.0.27  modId=betternether
#   bclib        21.0.26  modId=bclib
#   wover        21.0.26  modId=wover        (the file name is worldweaver-*.jar)
#   wunderlib    21.0.10  modId=wunderlib
# That is why the new format needs no @: the default already means "what is downloaded must call
# itself the same".
# The files on both sites are identical (BetterEnd 21.0.36 has the same SHA1 on both; the other four
# packages are byte-for-byte identical), so "CurseForge first" only picks a faster address for the
# same bytes.
#
# Note that these projects' slugs do not match their modids at all (betterend-neoforge,
# worldweaver-neoforge, ...), so the table uses project ids; that is also why "guess the slug from
# the modid" cannot be the only strategy (see docs/35a).
betterend = 1422294, IcERKldh
betternether = 1422293, fxX3RlL5
bclib = 1422283, 7bdKEtKC
wover = 1422284, R8uGDQpB
wunderlib = 1422273, HZmhgdJk
